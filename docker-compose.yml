services:
  app:
    build: .
    # Single instance only — do NOT add replicas/scale: every room's
    # TLSocketRoom lives in process memory and all writers share one SQLite
    # file (WAL), which corrupts under concurrent writers.
    ports:
      - "3000:3000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_DEFAULT_MODEL=${OPENAI_DEFAULT_MODEL:-gpt-5.4-mini}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      # REQUIRED in production: the image sets NODE_ENV=production, and the
      # server refuses to boot with the dev default below (see
      # src/server/config.ts). Generate one and put it in .env:
      #   openssl rand -base64 32
      - SESSION_SECRET=${SESSION_SECRET:-dev-secret-change-me}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DATA_DIR=/data
    volumes:
      - ./data:/data
      - ./music:/data/music:ro
    restart: unless-stopped